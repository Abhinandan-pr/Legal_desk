<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f4" />
  <title>LegalDesk — documents, made clearer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#home" aria-label="LegalDesk home"><span class="brand-mark">L</span><span>legal<span class="brand-light">desk</span></span></a>
    <div class="workspace-label">WORKSPACE</div>
    <nav aria-label="Main navigation">
      <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Overview</button>
      <button class="nav-item" data-view="library"><span class="nav-icon">▤</span>Document library</button>
      <button class="nav-item" data-view="documents"><span class="nav-icon">▧</span>My documents <span class="nav-count" id="doc-count">0</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="help-card"><div class="help-icon">✳</div><strong>Need a hand?</strong><p>Explore our guide to getting started.</p><button class="text-link" id="guide-btn">Read the guide <span>↗</span></button></div><div class="profile"><div class="avatar">G</div><div><strong>Guest workspace</strong><small>Local drafts only</small></div><span class="dots">···</span></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="breadcrumbs"><span>Workspace</span><span class="crumb-sep">/</span><strong id="crumb-current">Overview</strong></div><div class="top-actions"><span class="secure-label"><span class="secure-dot"></span> Private workspace</span><button class="icon-button" aria-label="Notifications">♧</button><div class="avatar avatar-small">G</div></div></header>
    <div id="app" class="content"></div>
  </main>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
